filebeat.inputs:
- type: container
  paths:
  - /var/lib/docker/containers/*/*.log
  processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: false
processors:
- drop_event:
    when:
      not:
        regexp:
          service: "^(gateway|orders|users|payments)$"
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "elk-obs-%{+yyyy.MM.dd}"
  allow_older_versions: true
setup.ilm.enabled: false
setup.template.enabled: false
