[SERVICE]
    Flush        2
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /var/log/flb_docker.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            json
    Reserve_Data      On

[FILTER]
    Name              grep
    Match             docker.*
    Regex             service ^(gateway|orders|users|payments)$

[OUTPUT]
    Name              opensearch
    Match             docker.*
    Host              opensearch
    Port              9200
    Index             obs-logs
    Logstash_Format   On
    Logstash_Prefix   obs-logs
    Suppress_Type_Name On
