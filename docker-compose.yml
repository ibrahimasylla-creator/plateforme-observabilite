x-backend-common: &backend-common
  image: plateforme-observabilite-backend:latest
  build:
    context: ./backend/orders
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - obs-net
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 512M

services:
  postgres:
    image: postgres:16-alpine
    container_name: obs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  migrate:
    image: plateforme-observabilite-backend:latest
    container_name: obs-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
    networks:
      - obs-net
    restart: "no"

  users:
    <<: *backend-common
    container_name: obs-users
    environment:
      APP_NAME: users
      OTEL_SERVICE_NAME: users
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    <<: *backend-common
    container_name: obs-payments
    environment:
      APP_NAME: payments
      OTEL_SERVICE_NAME: payments
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy

  orders:
    <<: *backend-common
    container_name: obs-orders
    environment:
      APP_NAME: orders
      OTEL_SERVICE_NAME: orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      USERS_URL: http://users:4001
      PAYMENTS_URL: http://payments:4003
    ports:
      - "4002:4002"
    depends_on:
      users:
        condition: service_started
      payments:
        condition: service_started

  gateway:
    <<: *backend-common
    container_name: obs-gateway
    environment:
      APP_NAME: gateway
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: 4000
      ORDERS_URL: http://orders:4002
    ports:
      - "4000:4000"
    depends_on:
      orders:
        condition: service_started

  frontend:
    image: plateforme-observabilite-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: obs-frontend
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  pgdata:

networks:
  obs-net:
    driver: bridge
